<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Painel Gestão de Férias - CONTERC</title>
  <style>
    /* Configurações Globais e Variáveis */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --name-col: 300px;
      --brand: #8b1538;
      --brand2: #a31e3c;
      --line: #e8e8e8;
    }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f1f1f1;
      color: #2d2d2d;
    }

    /* Cabeçalho */
    .header {
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      color: #fff;
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px #0003;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo {
      background: #fff;
      width: 50px;
      height: 50px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-weight: 800;
      color: var(--brand);
    }

    .gestao-ferias {
      font-size: 20px;
      font-weight: 650;
      letter-spacing: .4px;
    }

    .user-icon {
      background: #ffffff2e;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }

    /* Layout Geral */
    .container {
      padding: 20px 30px;
      max-width: 1700px;
      margin: auto;
    }

    .filters-section,
    .colaboradores-card,
    .chart-card,
    .tabs,
    .gantt-section {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 4px #00000014;
    }

    /* Filtros */
    .filters-section {
      padding: 20px;
      margin-bottom: 20px;
    }

    .filters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 15px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .filter-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--brand);
    }

    .filter-select {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
      font-size: 14px;
    }

    .filter-select:focus {
      outline: 2px solid #8b153833;
      border-color: var(--brand);
    }

    /* Estatísticas e Gráfico */
    .stats-section {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .colaboradores-card {
      padding: 20px;
      text-align: center;
    }

    .colaboradores-number {
      font-size: 48px;
      font-weight: 700;
      color: var(--brand);
      margin: 10px;
    }

    .colaboradores-label {
      font-size: 14px;
      color: #666;
      font-weight: 600;
    }

    .chart-card {
      padding: 20px;
    }

    .chart-title {
      font-size: 16px;
      font-weight: 650;
      margin-bottom: 15px;
    }

    .chart-bars {
      height: 150px;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      gap: 10px;
      padding: 10px 0;
    }

    .bar-container {
      height: 100%;
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }

    .bar-value {
      background: var(--brand);
      color: #fff;
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 650;
    }

    .bar {
      width: 100%;
      max-width: 42px;
      min-height: 3px;
      background: linear-gradient(var(--brand2), var(--brand));
      border-radius: 4px 4px 0 0;
    }

    .bar-label {
      font-size: 12px;
      color: #666;
    }

    /* Abas */
    .tabs {
      display: flex;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 15px;
      text-align: center;
      background: #f5f5f5;
      color: #666;
      font-weight: 600;
      cursor: pointer;
      border-right: 1px solid #ddd;
    }

    .tab:last-child {
      border: 0;
    }

    .tab.active {
      background: var(--brand);
      color: #fff;
    }

    /* Seção Gantt / Timeline */
    .gantt-section {
      padding: 20px;
    }

    .gantt-header-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 2px solid #f0f0f0;
    }

    .gantt-header-controls h3 {
      color: var(--brand);
    }

    .expand-btn {
      border: 0;
      background: #f4f4f4;
      padding: 9px 15px;
      border-radius: 4px;
      color: #555;
      cursor: pointer;
    }

    .timeline-container {
      overflow-x: auto;
      margin-top: 20px;
    }

    .timeline-inner {
      min-width: 950px;
    }

    .timeline-header,
    .timeline-row {
      display: flex;
    }

    .timeline-header {
      border-bottom: 2px solid #ddd;
      padding-bottom: 8px;
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 10;
    }

    .name-column,
    .employee-cell {
      width: var(--name-col);
      min-width: var(--name-col);
      padding: 10px;
    }

    .name-column {
      font-weight: 650;
      color: var(--brand);
    }

    .months-grid,
    .timeline-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(52px, 1fr));
      flex: 1;
      min-width: 624px;
    }

    .month-header {
      text-align: center;
      padding: 10px 3px;
      font-size: 12px;
      font-weight: 650;
      color: #666;
      border-right: 1px solid var(--line);
    }

    /* Agrupamentos por Célula */
    .group-header {
      background: #f8f8f8;
      padding: 12px 10px;
      margin: 10px 0;
      border-left: 4px solid var(--brand);
      font-weight: 650;
      color: var(--brand);
      cursor: pointer;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .expand-icon {
      font-size: 12px;
      transition: .2s;
    }

    .expand-icon.expanded {
      transform: rotate(90deg);
    }

    .timeline-row {
      border-bottom: 1px solid #eee;
      min-height: 90px;
      align-items: stretch;
    }

    .timeline-row:hover {
      background: #fafafa;
    }

    .employee-cell {
      font-size: 13px;
    }

    .employee-name {
      font-weight: 600;
    }

    .employee-id {
      font-size: 11px;
      color: #999;
      margin-top: 3px;
    }

    .timeline-grid {
      position: relative;
      background-image: linear-gradient(to right, transparent calc(100% - 1px), var(--line) calc(100% - 1px));
      background-size: calc(100% / 12) 100%;
      overflow: hidden;
    }

    .month-cell {
      min-height: 90px;
      border-right: 1px solid var(--line);
      pointer-events: none;
    }

    /* Barras de Férias e Eventos */
    .vacation-bar {
      position: absolute;
      height: 20px;
      border-radius: 4px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      white-space: nowrap;
      padding: 0 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: 0 2px 5px #0003;
      cursor: pointer;
      min-width: 3px;
      transition: filter .15s, transform .15s;
    }

    .vacation-bar:hover {
      filter: brightness(.88);
      transform: translateY(-1px);
      z-index: 5;
      overflow: visible;
      min-width: max-content;
    }

    .vacation-bar.ferias {
      background: linear-gradient(135deg, #d32f2f, #c62828);
    }

    .vacation-bar.folga {
      background: linear-gradient(135deg, #ff9800, #f57c00);
    }

    .vacation-bar.ausencia {
      background: linear-gradient(135deg, #5e35b1, #4527a0);
    }

    .vacation-bar.outros {
      background: linear-gradient(135deg, #607d8b, #455a64);
    }

    .vacation-bar.muito-curta {
      padding: 0;
      min-width: 4px;
    }

    /* Tooltip */
    .tooltip {
      position: fixed;
      display: none;
      background: #111e;
      color: #fff;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 12px;
      pointer-events: none;
      z-index: 9999;
      box-shadow: 0 4px 12px #0005;
    }

    /* Legenda */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 15px;
      background: #f8f8f8;
      border-radius: 6px;
      margin-top: 20px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .legend-color {
      width: 30px;
      height: 16px;
      border-radius: 8px;
    }

    .empty {
      padding: 20px;
      color: #666;
      text-align: center;
    }

    /* Responsividade */
    @media (max-width: 1200px) {
      .stats-section {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {
      :root {
        --name-col: 220px;
      }
      .container {
        padding: 15px;
      }
      .timeline-inner {
        min-width: 1050px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <div class="logo">BNB</div>
      <div class="gestao-ferias">GESTÃO DE FÉRIAS - CONTERC</div>
    </div>
    <div class="user-icon">👤</div>
  </header>

  <main class="container">
    <!-- Seção de Filtros -->
    <section class="filters-section">
      <div class="filters-grid">
        <div class="filter-group">
          <label class="filter-label" for="centroFilter">Centro de Custo</label>
          <select class="filter-select" id="centroFilter">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="funcaoFilter">Função</label>
          <select class="filter-select" id="funcaoFilter">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="anoFilter">Ano</label>
          <select class="filter-select" id="anoFilter"></select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="mesFilter">Mês Inicial</label>
          <select class="filter-select" id="mesFilter">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="gestorFilter">É Gestor?</label>
          <select class="filter-select" id="gestorFilter">
            <option value="">Todos</option>
            <option value="sim">Sim</option>
            <option value="nao">Não</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="funcionarioFilter">Funcionário</label>
          <select class="filter-select" id="funcionarioFilter">
            <option value="">Todos</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Estatísticas rápidas -->
    <section class="stats-section">
      <div class="colaboradores-card">
        <div class="colaboradores-label">Colaboradores com Eventos</div>
        <div class="colaboradores-number" id="totalColaboradores">0</div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Qtd. de Funcionários de Férias por Mês</div>
        <div class="chart-bars" id="chartBars"></div>
      </div>
    </section>

    <!-- Controle de Abas -->
    <div class="tabs">
      <div class="tab active" data-tab="programadas">Programadas</div>
      <div class="tab" data-tab="realizadas">Realizadas</div>
    </div>

    <!-- Linha do Tempo / Gantt -->
    <section class="gantt-section">
      <div class="gantt-header-controls">
        <h3>Detalhamento Férias</h3>
        <button class="expand-btn" id="toggleAllBtn">▼ Expandir Tudo</button>
      </div>
      <div class="timeline-container">
        <div class="timeline-inner">
          <div class="timeline-header">
            <div class="name-column">Colaborador</div>
            <div class="months-grid" id="monthsHeader"></div>
          </div>
          <div id="timelineContent"></div>
        </div>
      </div>

      <!-- Legendas -->
      <div class="legend">
        <div class="legend-item"><div class="legend-color" style="background:#d32f2f"></div>Férias</div>
        <div class="legend-item"><div class="legend-color" style="background:#ff9800"></div>Folga</div>
        <div class="legend-item"><div class="legend-color" style="background:#5e35b1"></div>Ausência Abonada</div>
        <div class="legend-item"><div class="legend-color" style="background:#607d8b"></div>Outros</div>
      </div>
    </section>
  </main>

  <div class="tooltip" id="tooltip"></div>

  <script>
    'use strict';

    // ==========================================
    // 1. Variáveis Globais e Constantes
    // ==========================================
    let dadosFerias = [];
    let currentTab = 'programadas';
    const expandedGroups = {};
    const meses = [
      'janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 
      'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'
    ];
    const MS_DAY = 86400000;
    const TRACK_H = 24;
    const GAP_DAYS = 2;

    // Atalho DOM
    const $ = id => document.getElementById(id);

    // ==========================================
    // 2. Funções Utilitárias e Normalização
    // ==========================================
    function text(v) {
      return String(v ?? '').trim();
    }

    function norm(v) {
      return text(v)
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toUpperCase();
    }

    function parseDate(value) {
      if (!value) return null;
      if (value instanceof Date && !Number.isNaN(value.getTime())) {
        return new Date(value.getFullYear(), value.getMonth(), value.getDate(), 12, 0, 0, 0);
      }
      const raw = text(value);
      let year, month, day;
      const isoMatch = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      const brMatch = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);

      if (isoMatch) {
        year = Number(isoMatch[1]);
        month = Number(isoMatch[2]);
        day = Number(isoMatch[3]);
      } else if (brMatch) {
        day = Number(brMatch[1]);
        month = Number(brMatch[2]);
        year = Number(brMatch[3]);
      } else {
        return null;
      }

      const parsed = new Date(year, month - 1, day, 12, 0, 0, 0);
      return (parsed.getFullYear() === year && parsed.getMonth() === month - 1 && parsed.getDate() === day) 
        ? parsed 
        : null;
    }

    function dayNumber(d) {
      return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / MS_DAY;
    }

    function daysBetween(a, b) {
      return Math.round(dayNumber(b) - dayNumber(a));
    }

    function yearRange(y) {
      const start = new Date(y, 0, 1, 12);
      const endExclusive = new Date(y + 1, 0, 1, 12);
      return {
        start,
        endExclusive,
        totalDays: daysBetween(start, endExclusive)
      };
    }

    function tipo(v) {
      const n = norm(v);
      if (n.includes('FERIA') || n === 'FER') return 'ferias';
      if (n.includes('FOLGA') || ['FEL', 'FOL'].includes(n)) return 'folga';
      if (n.includes('AUSENCIA') || n.includes('ABONAD') || ['ABO', 'AUS'].includes(n)) return 'ausencia';
      return 'outros';
    }

    function isManager(c) {
      const n = norm(c);
      return ['GERENTE', 'GESTOR', 'COORDENADOR', 'SUPERINTENDENTE'].some(x => n.includes(x));
    }

    function normalizeRecord(d, i) {
      const inicio = parseDate(d.Início ?? d.Inicio ?? d.data_inicio);
      const fim = parseDate(d.Fim ?? d.data_fim) ?? inicio;
      let a = inicio;
      let b = fim;
      if (a && b && b < a) {
        [a, b] = [b, a];
      }
      return {
        ...d,
        _id: i,
        colaborador: text(d.Nome ?? d.colaborador),
        matricula: text(d.Matrícula ?? d.Matricula ?? d.matricula),
        cargo: text(d.cargo ?? d.Cargo ?? (norm(d.Núcleo ?? d.Nucleo) === 'GESTAO' ? 'GERENTE DE CÉLULA' : 'FUNCIONÁRIO')),
        hierarquia: text(d.Núcleo ?? d.Nucleo ?? d.hierarquia ?? 'FUNCIONÁRIO(A)'),
        local: text(d.Célula ?? d.Celula ?? d.local),
        inicio: a,
        fim: b,
        tipoOriginal: text(d.Tipo ?? d.tipo),
        tipoClass: tipo(d.Tipo ?? d.tipo),
        status: text(d.status ?? d.Status ?? 'A Definir'),
        ordem: Number(d.ordem ?? 99)
      };
    }

    function statusRealizado(d) {
      const s = norm(d.status);
      if (['REALIZ', 'CONCLU', 'EXECUT'].some(x => s.includes(x))) return true;
      if (['CANCEL', 'INDEFER'].some(x => s.includes(x))) return false;
      const hoje = new Date();
      const today = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate(), 12);
      return ! !d.fim && d.fim < today;
    }

    function passesTab(d) {
      return currentTab === 'realizadas' ? statusRealizado(d) : !statusRealizado(d);
    }

    // ==========================================
    // 3. Filtros e Dados Filtrados
    // ==========================================
    function filters() {
      return {
        centro: $('centroFilter').value,
        funcao: $('funcaoFilter').value,
        ano: +$('anoFilter').value,
        mes: +$('mesFilter').value || 0,
        gestor: $('gestorFilter').value,
        funcionario: $('funcionarioFilter').value
      };
    }

    function filtered() {
      const f = filters();
      const yr = yearRange(f.ano);
      return dadosFerias.filter(d => {
        if (!passesTab(d) || !d.inicio) return false;
        if (f.centro && d.local !== f.centro) return false;
        if (f.funcao && d.cargo !== f.funcao) return false;
        if (f.funcionario && d.colaborador !== f.funcionario) return false;

        const g = isManager(d.cargo);
        if (f.gestor === 'sim' && !g) return false;
        if (f.gestor === 'nao' && g) return false;
        if (f.mes && d.inicio.getMonth() + 1 !== f.mes) return false;

        return d.fim >= yr.start && d.inicio < yr.endExclusive;
      });
    }

    function optionize(id, values, label = x => x) {
      const el = $(id);
      while (el.options.length > 1) el.remove(1);
      values.forEach(v => el.add(new Option(label(v), v)));
    }

    function populate() {
      optionize('centroFilter', [...new Set(dadosFerias.map(x => x.local).filter(Boolean))].sort());
      optionize('funcaoFilter', [...new Set(dadosFerias.map(x => x.cargo).filter(Boolean))].sort());
      optionize('funcionarioFilter', [...new Set(dadosFerias.map(x => x.colaborador).filter(Boolean))].sort());
      optionize(
        'mesFilter', 
        meses.map((_, i) => i + 1), 
        v => meses[v - 1][0].toUpperCase() + meses[v - 1].slice(1)
      );

      const years = [...new Set(dadosFerias.flatMap(x => [x.inicio?.getFullYear(), x.fim?.getFullYear()]).filter(Boolean))].sort();
      const now = new Date().getFullYear();
      $('anoFilter').innerHTML = '';
      (years.length ? years : [now]).forEach(y => $('anoFilter').add(new Option(y, y)));
      $('anoFilter').value = years.includes(now) ? now : Math.max(...(years.length ? years : [now]));
    }

    // ==========================================
    // 4. Interface e Lógica de Atualização
    // ==========================================
    function refresh() {
      updateStats();
      createChart();
      createTimeline();
    }

    function updateStats() {
      $('totalColaboradores').textContent = new Set(filtered().map(x => x.matricula || x.colaborador)).size;
    }

    function createChart() {
      const f = filters();
      const sets = Array.from({ length: 12 }, () => new Set());
      const yr = yearRange(f.ano);

      filtered()
        .filter(x => x.tipoClass === 'ferias')
        .forEach(d => {
          const start = d.inicio < yr.start ? yr.start : d.inicio;
          const end = d.fim >= yr.endExclusive ? new Date(f.ano, 11, 31, 12) : d.fim;
          for (let m = start.getMonth(); m <= end.getMonth(); m++) {
            sets[m].add(d.matricula || d.colaborador);
          }
        });

      const counts = sets.map(s => s.size);
      const max = Math.max(...counts, 1);
      const box = $('chartBars');
      box.innerHTML = '';

      const abrevMeses = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
      abrevMeses.forEach((m, i) => {
        const c = document.createElement('div');
        c.className = 'bar-container';
        c.innerHTML = `
          <div class="bar-value">${counts[i]}</div>
          <div class="bar" style="height:${Math.max(2, (counts[i] / max) * 100)}%"></div>
          <div class="bar-label">${m}</div>
        `;
        box.append(c);
      });
    }

    function safeId(v) {
      return norm(v)
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '_')
        .replace(/^_|_$/g, '');
    }

    function createTimeline() {
      const events = filtered();
      const content = $('timelineContent');
      content.innerHTML = '';

      const people = new Map();
      events.forEach(d => {
        const k = d.matricula || d.colaborador;
        if (!people.has(k)) {
          people.set(k, {
            nome: d.colaborador,
            matricula: d.matricula,
            cargo: d.cargo,
            local: d.local,
            ordem: d.ordem,
            eventos: []
          });
        }
        people.get(k).eventos.push(d);
      });

      const list = [...people.values()].sort(
        (a, b) => a.ordem - b.ordem || a.local.localeCompare(b.local) || a.nome.localeCompare(b.nome)
      );

      const groups = new Map();
      list.forEach(p => {
        const key = p.local || 'SEM CÉLULA';
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(p);
      });

      [...groups.keys()].sort().forEach(local => {
        const id = 'local_' + safeId(local);
        const header = document.createElement('div');
        header.className = 'group-header';
        header.dataset.groupId = id;
        
        const open = expandedGroups[id] !== false;
        header.innerHTML = `
          <span class="expand-icon ${open ? 'expanded' : ''}">▶</span>
          <span>${escapeHTML(groupLabel(groups.get(local), local))}</span>
        `;
        header.onclick = e => toggleGroup(e, id);
        content.append(header);

        const gc = document.createElement('div');
        gc.id = 'group-' + id;
        gc.className = 'group-content';
        gc.dataset.groupId = id;
        gc.style.display = open ? 'block' : 'none';

        groups.get(local)
          .sort((a, b) => (isManager(b.cargo) - isManager(a.cargo)) || a.nome.localeCompare(b.nome))
          .forEach(p => createRow(p, gc));

        content.append(gc);
      });

      if (!content.children.length) {
        const e = document.createElement('div');
        e.className = 'empty';
        e.textContent = 'Nenhum registro encontrado com os filtros atuais.';
        content.append(e);
      }
    }

    function groupLabel(arr, local) {
      if (arr.some(x => norm(x.cargo).includes('GERENTE DE AMBIENTE'))) {
        return `GERENTE DE AMBIENTE - ${local}`;
      }
      if (arr.some(x => norm(x.cargo).includes('GERENTE DE CELULA'))) {
        return `GERENTE DE CÉLULA - ${local}`;
      }
      return `EQUIPE - ${local}`;
    }

    function intervalsConflict(a, b) {
      return ! (a.fim.getTime() + GAP_DAYS * MS_DAY < b.inicio.getTime() || a.inicio.getTime() > b.fim.getTime() + GAP_DAYS * MS_DAY);
    }

    function tracks(items) {
      const out = [];
      [...items]
        .sort((a, b) => a.inicio - b.inicio)
        .forEach(ev => {
          let lane = out.find(t => t.every(x => !intervalsConflict(x, ev)));
          if (!lane) {
            lane = [];
            out.push(lane);
          }
          lane.push(ev);
        });
      return out;
    }

    function createRow(p, parent) {
      const row = document.createElement('div');
      row.className = 'timeline-row';

      const cell = document.createElement('div');
      cell.className = 'employee-cell';

      const n = document.createElement('div');
      n.className = 'employee-name';
      n.textContent = p.nome;

      const info = document.createElement('div');
      info.className = 'employee-id';
      info.textContent = [p.matricula, p.cargo].filter(Boolean).join(' - ');
      cell.append(n, info);
      row.append(cell);

      const grid = document.createElement('div');
      grid.className = 'timeline-grid';

      for (let i = 0; i < 12; i++) {
        const c = document.createElement('div');
        c.className = 'month-cell';
        grid.append(c);
      }

      const order = ['ferias', 'folga', 'ausencia', 'outros'];
      let laneOffset = 0;

      order.forEach(k => {
        const ts = tracks(p.eventos.filter(e => e.tipoClass === k));
        ts.forEach((lane, idx) => 
          lane.forEach(ev => {
            const b = createBar(ev, 8 + (laneOffset + idx) * TRACK_H);
            if (b) grid.append(b);
          })
        );
        laneOffset += Math.max(ts.length, 1);
      });

      const height = Math.max(90, 15 + laneOffset * TRACK_H);
      row.style.minHeight = height + 'px';
      grid.querySelectorAll('.month-cell').forEach(x => x.style.minHeight = height + 'px');
      row.append(grid);
      parent.append(row);
    }

    function createBar(ev, top) {
      const f = filters();
      const yr = yearRange(f.ano);
      const start = ev.inicio < yr.start ? yr.start : ev.inicio;
      
      const endExclusiveRaw = new Date(ev.fim.getFullYear(), ev.fim.getMonth(), ev.fim.getDate() + 1, 12);
      const endExclusive = endExclusiveRaw > yr.endExclusive ? yr.endExclusive : endExclusiveRaw;

      if (endExclusive <= yr.start || start >= yr.endExclusive) return null;

      const left = (daysBetween(yr.start, start) / yr.totalDays) * 100;
      const width = (daysBetween(start, endExclusive) / yr.totalDays) * 100;
      const duration = daysBetween(ev.inicio, new Date(ev.fim.getFullYear(), ev.fim.getMonth(), ev.fim.getDate() + 1, 12));

      const b = document.createElement('div');
      b.className = `vacation-bar ${ev.tipoClass}${width < .5 ? ' muito-curta' : ''}`;
      b.style.left = left + '%';
      b.style.width = width + '%';
      b.style.top = top + 'px';
      b.title = '';

      const label = `${fmt(ev.inicio)} - ${fmt(ev.fim)}`;
      b.textContent = width >= 2.3 ? label : (width >= 1 ? fmt(ev.inicio) : '');

      b.onmouseenter = e => showTip(e, ev, duration);
      b.onmousemove = moveTip;
      b.onmouseleave = hideTip;

      return b;
    }

    function fmt(d) {
      return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function full(d) {
      return `${fmt(d)}/${d.getFullYear()}`;
    }

    // ==========================================
    // 5. Tooltips e Eventos de Mouse
    // ==========================================
    function showTip(e, ev, duration) {
      const t = $('tooltip');
      t.innerHTML = `
        <strong>${escapeHTML(ev.tipoOriginal || 'Evento')}</strong><br>
        <strong>Início:</strong> ${full(ev.inicio)}<br>
        <strong>Fim:</strong> ${full(ev.fim)}<br>
        <strong>Dias:</strong> ${duration}<br>
        <strong>Status:</strong> ${escapeHTML(ev.status || '-')}
      `;
      t.style.display = 'block';
      moveTip(e);
    }

    function moveTip(e) {
      const t = $('tooltip');
      const pad = 12;
      const r = t.getBoundingClientRect();
      let x = e.clientX + 15;
      let y = e.clientY + 15;

      if (x + r.width > innerWidth - pad) x = e.clientX - r.width - 15;
      if (y + r.height > innerHeight - pad) y = e.clientY - r.height - 15;

      t.style.left = x + 'px';
      t.style.top = y + 'px';
    }

    function hideTip() {
      $('tooltip').style.display = 'none';
    }

    function escapeHTML(v) {
      return text(v).replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c]));
    }

    // ==========================================
    // 6. Manipulação de Colapso/Accordion
    // ==========================================
    function toggleGroup(e, id) {
      const c = $('group-' + id);
      const icon = e.currentTarget.querySelector('.expand-icon');
      const open = c.style.display !== 'none';

      c.style.display = open ? 'none' : 'block';
      icon.classList.toggle('expanded', !open);
      expandedGroups[id] = !open;
    }

    function toggleAll() {
      const cs = [...document.querySelectorAll('.group-content')];
      const all = cs.length && cs.every(x => x.style.display !== 'none');

      cs.forEach(c => {
        c.style.display = all ? 'none' : 'block';
        expandedGroups[c.dataset.groupId] = !all;
        document
          .querySelector(`.group-header[data-group-id="${c.dataset.groupId}"] .expand-icon`)
          ?.classList.toggle('expanded', !all);
      });

      $('toggleAllBtn').textContent = all ? '▼ Expandir Tudo' : '▲ Recolher Tudo';
    }

    // ==========================================
    // 7. Event Listener Bindings e Setup Geral
    // ==========================================
    function setup() {
      // Abas
      document.querySelectorAll('.tab').forEach(tab => {
        tab.onclick = () => {
          document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
          tab.classList.add('active');
          currentTab = tab.dataset.tab;
          refresh();
        };
      });

      // Filtros
      ['centroFilter', 'funcaoFilter', 'anoFilter', 'mesFilter', 'gestorFilter', 'funcionarioFilter'].forEach(id => {
        $(id).onchange = refresh;
      });

      $('toggleAllBtn').onclick = toggleAll;
      addEventListener('scroll', hideTip, { passive: true });
    }

    function monthsHeader() {
      const h = $('monthsHeader');
      h.innerHTML = '';
      meses.forEach(m => {
        const d = document.createElement('div');
        d.className = 'month-header';
        d.textContent = m;
        h.append(d);
      });
    }

    // ==========================================
    // 8. Carregamento Assíncrono Principal
    // ==========================================
    // A NOVA FUNÇÃO DE CARREGAMENTO (Cache-Busting Agressivo)
async function load() {
    try {
        // 1. Gera um código único garantido a cada milissegundo
        const antiCacheToken = new Date().getTime().toString() + Math.random().toString().substring(2);
        
        // 2. Força cabeçalhos rigorosos para o navegador e para o servidor do GitHub
        const headersAgressivos = new Headers({
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            'Pragma': 'no-cache',
            'Expires': '0'
        });

        // 3. Faz o pedido com o token único e os cabeçalhos
        const r = await fetch(`./dados.json?_t=${antiCacheToken}`, { 
            method: 'GET',
            headers: headersAgressivos,
            cache: 'no-store' 
        });
        
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        
        const raw = await r.json();
        if (!Array.isArray(raw)) throw new Error('O conteúdo precisa ser uma lista JSON');
        
        // 4. O Filtro de Erros (mantido para sua segurança)
        dadosFerias = raw.map(normalizeRecord).filter((x, index) => {
            const isValido = x.colaborador && x.inicio && x.fim;
            if (!isValido) {
                console.warn(`Aviso: Linha ${index + 2} ignorada. Dados lidos:`, x);
            }
            return isValido;
        });
        
        monthsHeader();
        populate();
        setup();
        refresh();
        
    } catch (err) {
        console.error("Falha ao carregar:", err);
        $('timelineContent').innerHTML = `<div class="empty" style="color:#b00020">Erro ao atualizar dados: ${escapeHTML(err.message)}. Verifique se o GitHub Pages já publicou a versão mais recente.</div>`;
    }
}

    // Inicialização automática do painel
    load();
  </script>
</body>
